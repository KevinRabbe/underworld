name: Character Reconcile Validation Once

on:
  push:
    branches:
      - worker/char-reconcile-001
    paths:
      - .github/workflows/char-reconcile-validate-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: worker/char-reconcile-001
          fetch-depth: 0
      - uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Lock authored minus-Z locomotion semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/character/test_semantic_animation_layer.gd')
          text = path.read_text()
          old = '''\tcontroller_a.update_locomotion(1.0 / 60.0, Vector3(0.0, 0.0, 4.0), 0.0, true, false)\n\tcontroller_b.update_locomotion(1.0 / 60.0, Vector3(0.0, 0.0, 4.0), 0.0, true, false)\n\t_expect_equal(failures, "set A locomotion binding", adapter_a.last_locomotion, "pack_a.walk_forward")\n\t_expect_equal(failures, "set B locomotion binding", adapter_b.last_locomotion, "pack_b.walk_forward")\n'''
          new = '''\tcontroller_a.update_locomotion(1.0 / 60.0, Vector3(0.0, 0.0, -4.0), 0.0, true, false)\n\tcontroller_b.update_locomotion(1.0 / 60.0, Vector3(0.0, 0.0, -4.0), 0.0, true, false)\n\t_expect_equal(failures, "set A local -Z locomotion maps to forward", adapter_a.last_locomotion, "pack_a.walk_forward")\n\t_expect_equal(failures, "set B local -Z locomotion maps to forward", adapter_b.last_locomotion, "pack_b.walk_forward")\n\tcontroller_a.update_locomotion(1.0 / 60.0, Vector3(0.0, 0.0, 4.0), 0.0, true, false)\n\tcontroller_b.update_locomotion(1.0 / 60.0, Vector3(0.0, 0.0, 4.0), 0.0, true, false)\n\t_expect_equal(failures, "set A local +Z locomotion maps to backward", adapter_a.last_locomotion, "pack_a.walk_backward")\n\t_expect_equal(failures, "set B local +Z locomotion maps to backward", adapter_b.last_locomotion, "pack_b.walk_backward")\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one locomotion expectation block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Run character contracts
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          godot --headless --path . --quit-after 1 \
            --script res://tests/run_character.gd 2>&1 \
            | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[CHARACTER VALIDATION] PASS' "$validation_log"
      - name: Commit regression and retire one-shot workflow
        run: |
          rm -f .github/workflows/char-reconcile-validate-once.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: lock faceted minus-Z facing semantics"
          git push origin HEAD:worker/char-reconcile-001
