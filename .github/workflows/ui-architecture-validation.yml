name: UI Architecture Validation

on:
  pull_request:
    paths:
      - 'project.godot'
      - 'presentation/ui/**'
      - 'tests/presentation/test_ui_architecture_contract.gd'
      - 'tests/presentation/test_ui_scale_contract.gd'
      - 'tests/presentation/fixtures/ui_skin_reuse_fixture.tscn'
      - 'tests/run_ui_architecture.gd'
      - '.github/workflows/ui-architecture-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'project.godot'
      - 'presentation/ui/**'
      - 'tests/presentation/test_ui_architecture_contract.gd'
      - 'tests/presentation/test_ui_scale_contract.gd'
      - 'tests/presentation/fixtures/ui_skin_reuse_fixture.tscn'
      - 'tests/run_ui_architecture.gd'
      - '.github/workflows/ui-architecture-validation.yml'

permissions:
  contents: read

jobs:
  ui-architecture-contracts:
    name: Godot UI architecture contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Show Godot version
        run: godot --version

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Run UI architecture contracts
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          godot --headless --path . \
            --script res://tests/run_ui_architecture.gd 2>&1 \
            | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[UI ARCHITECTURE VALIDATION] PASS' "$validation_log"
