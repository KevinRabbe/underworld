name: Generator Manifest Validation

on:
  pull_request:
    paths:
      - 'worldgen/versioning/generator_manifest.gd'
      - 'worldgen/random/seed_domain.gd'
      - 'worldgen/random/seed_domains.gd'
      - 'tests/generator_manifest/**'
      - 'tests/run_generator_manifest.gd'
      - '.github/workflows/generator-manifest-validation.yml'
  push:
    branches:
      - main
      - 'validation/generator-manifest-*'
    paths:
      - 'worldgen/versioning/generator_manifest.gd'
      - 'worldgen/random/seed_domain.gd'
      - 'worldgen/random/seed_domains.gd'
      - 'tests/generator_manifest/**'
      - 'tests/run_generator_manifest.gd'
      - '.github/workflows/generator-manifest-validation.yml'

permissions:
  contents: read

jobs:
  generator-manifest-contracts:
    name: Godot generator manifest contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Show Godot version
        run: godot --version

      - name: Run generator manifest contracts
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          godot --headless --path . --quit-after 1 \
            --script res://tests/run_generator_manifest.gd 2>&1 \
            | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[GENERATOR MANIFEST VALIDATION] PASS' "$validation_log"
