name: Inventory Identity Integration Validation

on:
  pull_request:
    paths:
      - 'gameplay/items/inventory/item_container_state.gd'
      - 'tests/inventory/test_authored_definition_identity.gd'
      - 'tests/run_inventory.gd'
      - '.github/workflows/inventory-identity-integration-validation.yml'
  push:
    branches:
      - main
      - 'inventory/inv-identity-*'
    paths:
      - 'gameplay/items/inventory/item_container_state.gd'
      - 'tests/inventory/test_authored_definition_identity.gd'
      - 'tests/run_inventory.gd'
      - '.github/workflows/inventory-identity-integration-validation.yml'

permissions:
  contents: read

jobs:
  app-shell-integration:
    name: Godot accepted app shell contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Show Godot version
        run: godot --version

      - name: Run accepted app shell contracts
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          godot --headless --path . \
            --script res://tests/run_app_shell.gd 2>&1 \
            | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[APP SHELL VALIDATION] PASS' "$validation_log"
