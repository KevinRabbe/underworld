name: Map Data Serialization Validation

on:
  pull_request:
    paths:
      - 'worldgen/persistence/**'
      - 'tests/persistence/**'
      - 'tests/run_map_data_serialization_validation.gd'
      - '.github/workflows/map-data-serialization-validation.yml'
  push:
    branches:
      - 'task/MAP-008-*'

permissions:
  contents: read

jobs:
  map-data-serialization:
    name: Godot map data serialization contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Run map data serialization contracts
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          godot --headless --path . --quit-after 1 \
            --script res://tests/run_map_data_serialization_validation.gd 2>&1 \
            | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[MAP DATA SERIALIZATION] PASS' "$validation_log"
