name: Character Head Push

on:
  push:
    branches:
      - codex/char-present-001
    paths:
      - ".github/workflows/character-head-push.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/char-present-001
          fetch-depth: 0

      - name: Apply head and hand convergence pass
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/character_head_patch_once.py
          git diff --check

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Validate character contracts
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          godot --headless --path . --quit-after 1 --script res://tests/run_character.gd 2>&1 | tee "$log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$log"; then
            exit 1
          fi
          grep -Fq '[CHARACTER VALIDATION] PASS' "$log"

      - name: Commit visual pass and retire executor
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "underworld-character-worker"
          git config user.email "underworld-character-worker@users.noreply.github.com"
          git add presentation/characters/faceted/faceted_body_compiler.gd presentation/characters/faceted/faceted_humanoid_body_profile.gd presentation/characters/voxel/baseline_survivor_factory.gd
          git rm .github/character_head_patch_once.py .github/workflows/character-head-push.yml
          git commit -m "CHAR-PRESENT-001: sculpt face hair and hands"
          git push origin HEAD:codex/char-present-001
