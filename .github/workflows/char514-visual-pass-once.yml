name: CHAR514 Visual Pass Once

on:
  push:
    branches:
      - worker/char-reconcile-001

permissions:
  contents: write

jobs:
  visual-pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout governed worker branch
        uses: actions/checkout@v6
        with:
          ref: worker/char-reconcile-001
          fetch-depth: 0

      - name: Assert latest accepted-main ancestry
        shell: bash
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor aa094a5a9737c4275067a41728ac1282b3a9a2c5 HEAD

      - name: Apply bounded presentation-only target convergence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          profile = "presentation/characters/faceted/faceted_humanoid_body_profile.gd"
          for old, new in [
              ("@export var shoulder_width: float = 0.58", "@export var shoulder_width: float = 0.62"),
              ("@export var chest_width: float = 0.48", "@export var chest_width: float = 0.515"),
              ("@export var chest_depth: float = 0.285", "@export var chest_depth: float = 0.31"),
              ("@export var waist_width: float = 0.355", "@export var waist_width: float = 0.385"),
              ("@export var pelvis_width: float = 0.42", "@export var pelvis_width: float = 0.45"),
              ("@export var thigh_diameter: float = 0.20", "@export var thigh_diameter: float = 0.225"),
              ("@export var calf_diameter: float = 0.16", "@export var calf_diameter: float = 0.18"),
              ("@export var ankle_width: float = 0.095", "@export var ankle_width: float = 0.105"),
              ("@export var foot_length: float = 0.275", "@export var foot_length: float = 0.285"),
              ("@export var foot_width: float = 0.115", "@export var foot_width: float = 0.125"),
              ("@export var head_width: float = 0.205", "@export var head_width: float = 0.218"),
              ("@export var head_depth: float = 0.215", "@export var head_depth: float = 0.232"),
              ("@export var head_height: float = 0.250", "@export var head_height: float = 0.255"),
              ("@export var torso_length: float = 0.650", "@export var torso_length: float = 0.665"),
              ("@export var leg_length: float = 0.900", "@export var leg_length: float = 0.880"),
              ("@export var arm_length: float = 0.715", "@export var arm_length: float = 0.705"),
              ("@export var arm_mass: float = 1.00", "@export var arm_mass: float = 1.06"),
              ("@export var outfit_shell_offset: float = 0.018", "@export var outfit_shell_offset: float = 0.020"),
          ]:
              replace_once(profile, old, new)

          factory = "presentation/characters/voxel/baseline_survivor_factory.gd"
          for old, new in [
              ('_entry("skin", Color("bf8b6a"), 0.80, 0.0)', '_entry("skin", Color("b98361"), 0.80, 0.0)'),
              ('_entry("cloth", Color("927958"), 0.93, 0.0)', '_entry("cloth", Color("887257"), 0.93, 0.0)'),
              ('_entry("accent", Color("356f78"), 0.84, 0.0)', '_entry("accent", Color("2f5e66"), 0.84, 0.0)'),
              ('_entry("canvas_light", Color("b5a486"), 0.95, 0.0)', '_entry("canvas_light", Color("aa9879"), 0.95, 0.0)'),
              ('_entry("trouser", Color("373c3b"), 0.92, 0.0)', '_entry("trouser", Color("323637"), 0.92, 0.0)'),
              ('_entry("canvas_dark", Color("6c624f"), 0.96, 0.0)', '_entry("canvas_dark", Color("625a49"), 0.96, 0.0)'),
              ('_tool_part("axe_handle", "stone_axe", _box(Vector3i(0,-9,0), Vector3i(0,4,0), LEATHER), Vector3i.ZERO)', '_tool_part("axe_handle", "stone_axe", _box(Vector3i(0,-12,0), Vector3i(0,5,0), LEATHER), Vector3i.ZERO)'),
          ]:
              replace_once(factory, old, new)
          replace_once(factory,
              '''\tvar rows := {\n\t\t2: [-1, 1],\n\t\t3: [-2, 1],\n\t\t4: [-3, 1],\n\t\t5: [-3, 0],\n\t\t6: [-2, -1],\n\t}''',
              '''\tvar rows := {\n\t\t0: [-1, 1],\n\t\t1: [-2, 1],\n\t\t2: [-3, 1],\n\t\t3: [-4, 1],\n\t\t4: [-4, 0],\n\t\t5: [-3, -1],\n\t\t6: [-2, -1],\n\t}''')

          compiler = "presentation/characters/faceted/faceted_body_compiler.gd"
          replace_once(compiler, "const COMPILER_REVISION := 11", "const COMPILER_REVISION := 12")
          replace_once(compiler,
              '''\t_add_quad_prism_z(builders, CLOTH,\n\t\tVector2(-0.205, shoulder_y - 0.078),\n\t\tVector2(-0.046, chest_y - 0.135),\n\t\tVector2(-0.062, pelvis_y + 0.040),\n\t\tVector2(-0.205, pelvis_y + 0.020),\n\t\tvest_front_z, vest_back_z, _weights2(BONE.chest, BONE.spine_02, 0.25))\n\t_add_quad_prism_z(builders, CLOTH,\n\t\tVector2(0.205, shoulder_y - 0.078),\n\t\tVector2(0.046, chest_y - 0.135),\n\t\tVector2(0.062, pelvis_y + 0.040),\n\t\tVector2(0.205, pelvis_y + 0.020),\n\t\tvest_front_z, vest_back_z, _weights2(BONE.chest, BONE.spine_02, 0.25))''',
              '''\t_add_quad_prism_z(builders, CLOTH,\n\t\tVector2(-0.220, shoulder_y - 0.082),\n\t\tVector2(-0.050, chest_y - 0.070),\n\t\tVector2(-0.030, pelvis_y + 0.035),\n\t\tVector2(-0.220, pelvis_y + 0.015),\n\t\tvest_front_z, vest_back_z, _weights2(BONE.chest, BONE.spine_02, 0.25))\n\t_add_quad_prism_z(builders, CLOTH,\n\t\tVector2(0.220, shoulder_y - 0.082),\n\t\tVector2(0.050, chest_y - 0.070),\n\t\tVector2(0.030, pelvis_y + 0.035),\n\t\tVector2(0.220, pelvis_y + 0.015),\n\t\tvest_front_z, vest_back_z, _weights2(BONE.chest, BONE.spine_02, 0.25))''')
          replace_once(compiler,
              '''\t_add_ribbon_z(builders, CANVAS_DARK, Vector2(-0.158, shoulder_y - 0.060), Vector2(-0.043, chest_y - 0.142), vest_front_z - 0.010, 0.020, _weights(BONE.chest), _weights(BONE.chest), -1.0)\n\t_add_ribbon_z(builders, CANVAS_DARK, Vector2(0.158, shoulder_y - 0.060), Vector2(0.043, chest_y - 0.142), vest_front_z - 0.010, 0.020, _weights(BONE.chest), _weights(BONE.chest), -1.0)''',
              '''\t_add_ribbon_z(builders, CANVAS_DARK, Vector2(-0.172, shoulder_y - 0.062), Vector2(-0.046, chest_y - 0.078), vest_front_z - 0.010, 0.018, _weights(BONE.chest), _weights(BONE.chest), -1.0)\n\t_add_ribbon_z(builders, CANVAS_DARK, Vector2(0.172, shoulder_y - 0.062), Vector2(0.046, chest_y - 0.078), vest_front_z - 0.010, 0.018, _weights(BONE.chest), _weights(BONE.chest), -1.0)''')
          replace_once(compiler,
              '''\t_add_tri_prism_z(builders, ACCENT,\n\t\tVector2(-0.100, shoulder_y - 0.052),\n\t\tVector2(0.100, shoulder_y - 0.052),\n\t\tVector2(0.012, chest_y - 0.125),\n\t\tvest_front_z - 0.055, vest_front_z - 0.025, _weights(BONE.chest))''',
              '''\t_add_tri_prism_z(builders, ACCENT,\n\t\tVector2(-0.095, shoulder_y - 0.052),\n\t\tVector2(0.095, shoulder_y - 0.052),\n\t\tVector2(0.010, chest_y - 0.070),\n\t\tvest_front_z - 0.055, vest_front_z - 0.025, _weights(BONE.chest))''')
          replace_once(compiler,
              '''\t_add_y_loft(builders, CANVAS_DARK, [\n\t\t_ring_y(Vector3(0, waist_y - 0.020, 0.220), 0.145, 0.070, _weights(BONE.chest)),\n\t\t_ring_y(Vector3(0, lerpf(waist_y, lower_chest_y, 0.48), 0.238), 0.190, 0.105, _weights(BONE.chest)),\n\t\t_ring_y(Vector3(0, chest_y - 0.045, 0.242), 0.205, 0.112, _weights(BONE.chest)),\n\t\t_ring_y(Vector3(0, shoulder_y - 0.155, 0.235), 0.192, 0.105, _weights(BONE.chest)),\n\t\t_ring_y(Vector3(0, shoulder_y - 0.070, 0.218), 0.158, 0.082, _weights(BONE.chest)),\n\t], 8, true, true)''',
              '''\t_add_y_loft(builders, CANVAS_DARK, [\n\t\t_ring_y(Vector3(0, waist_y - 0.030, 0.228), 0.165, 0.080, _weights(BONE.chest)),\n\t\t_ring_y(Vector3(0, lerpf(waist_y, lower_chest_y, 0.48), 0.250), 0.215, 0.115, _weights(BONE.chest)),\n\t\t_ring_y(Vector3(0, chest_y - 0.045, 0.260), 0.235, 0.125, _weights(BONE.chest)),\n\t\t_ring_y(Vector3(0, shoulder_y - 0.155, 0.252), 0.225, 0.115, _weights(BONE.chest)),\n\t\t_ring_y(Vector3(0, shoulder_y - 0.070, 0.232), 0.185, 0.090, _weights(BONE.chest)),\n\t], 8, true, true)''')
          replace_once(compiler,
              '''\t_add_quad_prism_z(builders, CANVAS_LIGHT,\n\t\tVector2(-0.170, chest_y + 0.060),\n\t\tVector2(0.170, chest_y + 0.060),\n\t\tVector2(0.145, chest_y - 0.105),\n\t\tVector2(-0.145, chest_y - 0.105),\n\t\t0.338, 0.372, _weights(BONE.chest))''',
              '''\t_add_quad_prism_z(builders, CLOTH,\n\t\tVector2(-0.190, chest_y + 0.060),\n\t\tVector2(0.190, chest_y + 0.060),\n\t\tVector2(0.165, chest_y - 0.112),\n\t\tVector2(-0.165, chest_y - 0.112),\n\t\t0.386, 0.416, _weights(BONE.chest))''')
          replace_once(compiler,
              '''\t_add_quad_prism_z(builders, CANVAS_DARK,\n\t\tVector2(-0.135, waist_y + 0.175),\n\t\tVector2(0.135, waist_y + 0.175),\n\t\tVector2(0.115, waist_y + 0.035),\n\t\tVector2(-0.115, waist_y + 0.035),\n\t\t0.344, 0.382, _weights(BONE.chest))''',
              '''\t_add_quad_prism_z(builders, CANVAS_DARK,\n\t\tVector2(-0.150, waist_y + 0.185),\n\t\tVector2(0.150, waist_y + 0.185),\n\t\tVector2(0.130, waist_y + 0.025),\n\t\tVector2(-0.130, waist_y + 0.025),\n\t\t0.392, 0.425, _weights(BONE.chest))''')
          replace_once(compiler, 'for strap_x in [-0.112, 0.112]:', 'for strap_x in [-0.125, 0.125]:')
          replace_once(compiler, '\t\t\t0.386, 0.015, _weights(BONE.chest), _weights(BONE.chest), 1.0)', '\t\t\t0.430, 0.016, _weights(BONE.chest), _weights(BONE.chest), 1.0)')
          replace_once(compiler,
              '''\t\t_add_box(builders, METAL,\n\t\t\tVector3(strap_x - 0.018, lower_chest_y - 0.010, 0.384),\n\t\t\tVector3(strap_x + 0.018, lower_chest_y + 0.024, 0.397),''',
              '''\t\t_add_box(builders, METAL,\n\t\t\tVector3(strap_x - 0.018, lower_chest_y - 0.010, 0.428),\n\t\t\tVector3(strap_x + 0.018, lower_chest_y + 0.024, 0.442),''')
          replace_once(compiler,
              '''\t_add_x_loft(builders, ACCENT, [\n\t\t_ring_x(Vector3(-0.205, shoulder_y - 0.010, 0.305), 0.064, 0.066, _weights(BONE.chest)),\n\t\t_ring_x(Vector3(0.205, shoulder_y - 0.010, 0.305), 0.064, 0.066, _weights(BONE.chest)),''',
              '''\t_add_x_loft(builders, ACCENT, [\n\t\t_ring_x(Vector3(-0.235, shoulder_y - 0.010, 0.340), 0.073, 0.078, _weights(BONE.chest)),\n\t\t_ring_x(Vector3(0.235, shoulder_y - 0.010, 0.340), 0.073, 0.078, _weights(BONE.chest)),''')
          replace_once(compiler, 'for roll_strap_x in [-0.112, 0.112]:', 'for roll_strap_x in [-0.125, 0.125]:')
          replace_once(compiler, '\t\t\t0.374, 0.014, _weights(BONE.chest), _weights(BONE.chest), 1.0)', '\t\t\t0.432, 0.014, _weights(BONE.chest), _weights(BONE.chest), 1.0)')
          replace_once(compiler,
              '''\t\t_add_box(builders, METAL,\n\t\t\tVector3(roll_strap_x - 0.014, shoulder_y - 0.016, 0.373),\n\t\t\tVector3(roll_strap_x + 0.014, shoulder_y + 0.012, 0.385),''',
              '''\t\t_add_box(builders, METAL,\n\t\t\tVector3(roll_strap_x - 0.014, shoulder_y - 0.016, 0.430),\n\t\t\tVector3(roll_strap_x + 0.014, shoulder_y + 0.012, 0.444),''')
          replace_once(compiler, 'var brow_outer := Vector2(side * 0.062, eye_y + 0.018)', 'var brow_outer := Vector2(side * 0.068, eye_y + 0.018)')
          replace_once(compiler, 'face_front - 0.021, 0.006, skin, skin, -1.0)', 'face_front - 0.022, 0.008, skin, skin, -1.0)')
          replace_once(compiler, 'var eye_outer: Vector3 = Vector3(side * 0.050, eye_y - 0.004, face_front - 0.018)', 'var eye_outer: Vector3 = Vector3(side * 0.054, eye_y - 0.004, face_front - 0.019)')
          replace_once(compiler, 'var nose_tip_l := Vector3(-0.020, nose_tip_y, face_front - 0.060)', 'var nose_tip_l := Vector3(-0.021, nose_tip_y, face_front - 0.064)')
          replace_once(compiler, 'var nose_tip_r := Vector3(0.020, nose_tip_y, face_front - 0.060)', 'var nose_tip_r := Vector3(0.021, nose_tip_y, face_front - 0.064)')
          replace_once(compiler, '_add_ribbon_z(builders, FACE, Vector2(-0.030, mouth_y), Vector2(0.030, mouth_y), face_front - 0.019, 0.0035, skin, skin, -1.0)', '_add_ribbon_z(builders, FACE, Vector2(-0.034, mouth_y), Vector2(0.034, mouth_y), face_front - 0.020, 0.0040, skin, skin, -1.0)')

          test = "tests/character/test_voxel_character.gd"
          replace_once(test,
              'is_equal_approx(body_profile.shoulder_width, 0.58) and is_equal_approx(body_profile.chest_width, 0.48) and is_equal_approx(body_profile.pelvis_width, 0.42) and is_equal_approx(body_profile.thigh_diameter, 0.20) and is_equal_approx(body_profile.calf_diameter, 0.16)',
              'is_equal_approx(body_profile.shoulder_width, 0.62) and is_equal_approx(body_profile.chest_width, 0.515) and is_equal_approx(body_profile.pelvis_width, 0.45) and is_equal_approx(body_profile.thigh_diameter, 0.225) and is_equal_approx(body_profile.calf_diameter, 0.18)')
          replace_once(test,
              '{"calf_diameter": 0.16, "shoulder_width": 0.58, "chest_width": 0.48}',
              '{"calf_diameter": 0.18, "shoulder_width": 0.62, "chest_width": 0.515}')
          PY
          git diff --check
          git diff --stat

      - name: Remove one-shot runner before validation commit
        run: git rm .github/workflows/char514-visual-pass-once.yml

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import changed presentation resources
        run: godot --headless --editor --path . --quit

      - name: Character contracts
        run: |
          set -o pipefail
          log="$(mktemp)"
          godot --headless --path . --quit-after 1 --script res://tests/run_character.gd 2>&1 | tee "$log"
          ! grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$log"
          grep -Fq '[CHARACTER VALIDATION] PASS' "$log"

      - name: Repository layout
        run: python3 tools/ci/validate_repository_layout.py

      - name: Commit bounded visual iteration
        shell: bash
        run: |
          set -euxo pipefail
          test ! -e .github/workflows/char514-visual-pass-once.yml
          git diff --check
          git add presentation/characters/faceted/faceted_humanoid_body_profile.gd \
                  presentation/characters/faceted/faceted_body_compiler.gd \
                  presentation/characters/voxel/baseline_survivor_factory.gd \
                  tests/character/test_voxel_character.gd \
                  .github/workflows/char514-visual-pass-once.yml
          git diff --check --cached
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'character: converge survivor presentation toward locked target'
          git push origin HEAD:worker/char-reconcile-001
