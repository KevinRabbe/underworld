name: Resource Runtime Validation

on:
  pull_request:
    paths:
      - 'gameplay/resources/runtime/**'
      - 'worldgen/identity/stable_id.gd'
      - 'worldgen/geometry/geometry_cell_address.gd'
      - 'worldgen/runtime/underworld_cave_runtime_controller.gd'
      - 'worldgen/runtime/underworld_runtime_cell_definition_service.gd'
      - 'worldgen/runtime/underworld_runtime_cell_source_query.gd'
      - 'worldgen/runtime/underworld_runtime_cell_lifecycle_relay.gd'
      - 'worldgen/runtime/underworld_runtime_cell_executor.gd'
      - 'worldgen/runtime/underworld_runtime_streamer.gd'
      - 'worldgen/runtime/runtime_cell_record.gd'
      - 'content/placement/underground_placement_candidate.gd'
      - 'content/placement/underground_placement_policy.gd'
      - 'content/placement/underground_placement_record.gd'
      - 'content/placement/underground_placement_service.gd'
      - 'content/reserved_sites/reserved_site_assignment.gd'
      - 'content/reserved_sites/reserved_site_assignment_service.gd'
      - 'content/reserved_sites/reserved_site_content_definition.gd'
      - 'gameplay/resources/definitions/resource_definition.gd'
      - 'gameplay/resources/definitions/resource_yield_rule.gd'
      - 'gameplay/resources/definitions/authored_harvestable_resource_definition.gd'
      - 'gameplay/resources/state/resource_depletion_state.gd'
      - 'worldgen/persistence/world_delta_store.gd'
      - 'content/resources/**'
      - 'content/items/resources/iron_chunk_definition.tres'
      - 'content/items/resources/stone_definition.tres'
      - 'content/items/tools/stone_pickaxe_definition.tres'
      - 'presentation/world/resources/**'
      - 'gameplay/items/definitions/item_definition.gd'
      - 'gameplay/items/equipment/equipment_hotbar_state.gd'
      - 'gameplay/items/equipment/equipped_item_resolver.gd'
      - 'gameplay/items/equipment/equipment_slot_rule.gd'
      - 'gameplay/items/equipment/equipment_service.gd'
      - 'gameplay/items/weapons/definitions/weapon_definition.gd'
      - 'gameplay/items/weapons/runtime/weapon_attack_resolver.gd'
      - 'gameplay/items/inventory/item_container_state.gd'
      - 'gameplay/items/inventory/inventory_transaction_plan.gd'
      - 'gameplay/items/inventory/inventory_transaction_service.gd'
      - 'gameplay/items/inventory/inventory_transaction_checkpoint.gd'
      - 'gameplay/items/inventory/inventory_state_codec.gd'
      - 'gameplay/items/inventory/item_stack_state.gd'
      - 'gameplay/items/inventory/item_instance_state.gd'
      - 'tests/resources/test_underground_resource_runtime.gd'
      - 'tests/resources/test_underground_resource_cell_observer.gd'
      - 'tests/resources/test_underground_resource_composition.gd'
      - 'tests/resources/test_underground_resource_residency.gd'
      - 'tests/resources/test_underground_resource_mining_ticket.gd'
      - 'tests/resources/test_underground_resource_support.gd'
      - 'tests/resources/test_underground_resource_harvest_sink.gd'
      - 'tests/resources/test_underground_resource_runtime_composition.gd'
      - 'tests/resources/test_underground_resource_realization.gd'
      - 'tests/run_resource_runtime.gd'
      - 'tests/run_resource_composition.gd'
      - '.github/workflows/resource-runtime-validation.yml'
  push:
    branches:
      - main
      - 'gameplay/resource-runtime-*'

permissions:
  contents: read

jobs:
  resource-runtime-contracts:
    name: Godot resource runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Show Godot version
        run: godot --version

      # Keep the embedded persistence contract on the same accepted invocation
      # prerequisites as Persistence State Validation. Imported SVG/UI resources
      # are required by the integrated Game lifecycle exercised later below.
      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Run resource runtime contracts
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          godot --headless --path . --quit-after 1 \
            --script res://tests/run_resource_runtime.gd 2>&1 \
            | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[RESOURCE RUNTIME VALIDATION] PASS' "$validation_log"

      - name: Run resource composition bridge contracts
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          # Successful physics-backed tests own quit(0/1). The generous safety
          # cap prevents an unexpected script error from stranding SceneTree and
          # hiding the diagnostic until the 10-minute workflow timeout.
          godot --headless --path . --quit-after 600 \
            --script res://tests/run_resource_composition.gd 2>&1 \
            | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[RESOURCE COMPOSITION VALIDATION] PASS' "$validation_log"

      - name: Run accepted numeric contracts
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          godot --headless --path . --quit-after 1 \
            --script res://tests/run_numeric_validation.gd 2>&1 \
            | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[NUMERIC VALIDATION] PASS' "$validation_log"

      - name: Run accepted persistence-state contracts
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          # Persistence runtime contracts deliberately await real physics frames.
          # Match the accepted Persistence State Validation runner and let its
          # SceneTree runner own quit(0/1); --quit-after 1 truncates that proof.
          godot --headless --path . \
            --script res://tests/run_persistence_state.gd 2>&1 \
            | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[PERSISTENCE STATE VALIDATION] PASS' "$validation_log"

      - name: Run content contracts
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          godot --headless --path . --quit-after 1 \
            --script res://tests/run_content.gd 2>&1 \
            | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[VALIDATION] PASS content' "$validation_log"

      - name: Run inventory contracts
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          godot --headless --path . --quit-after 1 \
            --script res://tests/run_inventory.gd 2>&1 \
            | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[INVENTORY VALIDATION] PASS' "$validation_log"
