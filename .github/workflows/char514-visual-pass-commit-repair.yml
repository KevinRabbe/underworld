name: CHAR514 Visual Pass Commit Repair

on:
  push:
    branches:
      - worker/char-reconcile-001

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout governed worker branch
        uses: actions/checkout@v6
        with:
          ref: worker/char-reconcile-001
          fetch-depth: 0

      - name: Assert accepted-main ancestry
        run: git merge-base --is-ancestor aa094a5a9737c4275067a41728ac1282b3a9a2c5 HEAD

      - name: Reapply exact previously validated visual patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/char514-visual-pass-once.yml').read_text()
          begin_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n"
          start = source.index(begin_marker) + len(begin_marker)
          end = source.index(end_marker, start)
          raw = source[start:end]
          lines = []
          for line in raw.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/char514_visual_patch.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/char514_visual_patch.py
          git diff --check
          git diff --stat

      - name: Remove temporary visual-pass workflows
        run: |
          git rm .github/workflows/char514-visual-pass-once.yml
          git rm .github/workflows/char514-visual-pass-commit-repair.yml

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import changed presentation resources
        run: godot --headless --editor --path . --quit

      - name: Character contracts
        run: |
          set -o pipefail
          log="$(mktemp)"
          godot --headless --path . --quit-after 1 --script res://tests/run_character.gd 2>&1 | tee "$log"
          ! grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$log"
          grep -Fq '[CHARACTER VALIDATION] PASS' "$log"

      - name: Repository layout
        run: python3 tools/ci/validate_repository_layout.py

      - name: Commit exact validated presentation delta
        shell: bash
        run: |
          set -euxo pipefail
          test ! -e .github/workflows/char514-visual-pass-once.yml
          test ! -e .github/workflows/char514-visual-pass-commit-repair.yml
          git diff --check
          git add presentation/characters/faceted/faceted_humanoid_body_profile.gd \
                  presentation/characters/faceted/faceted_body_compiler.gd \
                  presentation/characters/voxel/baseline_survivor_factory.gd \
                  tests/character/test_voxel_character.gd
          git diff --check --cached
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'character: converge survivor presentation toward locked target'
          git push origin HEAD:worker/char-reconcile-001
