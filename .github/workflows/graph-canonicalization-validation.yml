name: Graph Canonicalization Validation

on:
  pull_request:
    paths:
      - 'tests/graph_canonicalization/**'
      - 'tests/run_graph_canonicalization.gd'
      - 'worldgen/graph/**'
      - 'worldgen/validation/graph_canonicalizer.gd'
      - 'worldgen/validation/canonical_value.gd'
      - '.github/workflows/graph-canonicalization-validation.yml'
  push:
    branches:
      - 'tests/graph-canonicalization-v0.01'

permissions:
  contents: read

jobs:
  graph-canonicalization:
    name: Godot graph canonicalization contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Run canonicalization contracts
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          godot --headless --path . \
            --script res://tests/run_graph_canonicalization.gd 2>&1 \
            | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[GRAPH CANONICALIZATION] PASS' "$validation_log"
