name: AUDIO-001 Semantic Producer Patch

on:
  push:
    branches:
      - 'presentation/audio-001-m3-binding'

permissions:
  contents: write

jobs:
  apply-semantic-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout worker branch
        uses: actions/checkout@v6
        with:
          ref: presentation/audio-001-m3-binding
          fetch-depth: 0

      - name: Apply exact AUDIO-001 semantic boundary repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Player: emit only after authoritative health mutation.
          patch(
              'gameplay/player/player.gd',
              'signal parry_succeeded(source_position: Vector3)\nsignal defeat_requested(reason: StringName)\n',
              'signal parry_succeeded(source_position: Vector3)\nsignal damage_committed(amount: int, remaining_health: int, source_position: Vector3)\nsignal defeat_requested(reason: StringName)\n',
          )
          patch(
              'gameplay/player/player.gd',
              '\tdamage_invulnerability_timer = DAMAGE_INVULNERABILITY\n\thealth = maxi(health - amount, 0)\n\tif animation_controller != null:\n',
              '\tdamage_invulnerability_timer = DAMAGE_INVULNERABILITY\n\tvar previous_health: int = health\n\thealth = maxi(health - amount, 0)\n\tvar committed_damage: int = previous_health - health\n\tif committed_damage > 0:\n\t\tdamage_committed.emit(committed_damage, health, source_position)\n\tif animation_controller != null:\n',
          )

          # Survival: relay existing committed partial hit and explicit successful craft completion.
          patch(
              'gameplay/survival/prototype_survival_controller.gd',
              'signal equipped_tool_changed(tool_id: String)\nsignal harvest_result(event: Dictionary)\n',
              'signal equipped_tool_changed(tool_id: String)\nsignal harvest_result(event: Dictionary)\nsignal craft_completed(recipe_id: String, item_id: String)\n',
          )
          patch(
              'gameplay/survival/prototype_survival_controller.gd',
              '''\tif next_hits < required_hits:\n\t\tobject_hit_progress[object_id] = next_hits\n\t\tlast_action_message = "%s hit %d/%d" % [object_type.capitalize(), next_hits, required_hits]\n\t\treturn _harvest_success({\n\t\t\t"object_id": object_id,\n\t\t\t"object_type": object_type,\n\t\t\t"hits": next_hits,\n\t\t\t"required_hits": required_hits,\n\t\t\t"completed": false,\n\t\t\t"events": [{\n\t\t\t\t"type": "harvest.hit_registered",\n\t\t\t\t"object_id": object_id,\n\t\t\t\t"object_type": object_type,\n\t\t\t\t"hits": next_hits,\n\t\t\t\t"required_hits": required_hits,\n\t\t\t}],\n\t\t})\n''',
              '''\tif next_hits < required_hits:\n\t\tobject_hit_progress[object_id] = next_hits\n\t\tlast_action_message = "%s hit %d/%d" % [object_type.capitalize(), next_hits, required_hits]\n\t\tvar hit_event: Dictionary = {\n\t\t\t"type": "harvest.hit_registered",\n\t\t\t"object_id": object_id,\n\t\t\t"object_type": object_type,\n\t\t\t"hits": next_hits,\n\t\t\t"required_hits": required_hits,\n\t\t\t"world_position": player.global_position if player != null else Vector3.ZERO,\n\t\t}\n\t\tharvest_result.emit(hit_event)\n\t\treturn _harvest_success({\n\t\t\t"object_id": object_id,\n\t\t\t"object_type": object_type,\n\t\t\t"hits": next_hits,\n\t\t\t"required_hits": required_hits,\n\t\t\t"completed": false,\n\t\t\t"events": [hit_event],\n\t\t})\n''',
          )
          patch(
              'gameplay/survival/prototype_survival_controller.gd',
              '\tlast_action_message = "Crafted Stone Axe" if recipe_id == "stone_axe" else "Crafted Stone Pickaxe"\n\tequipped_tool_changed.emit(equipped_tool)\n',
              '\tlast_action_message = "Crafted Stone Axe" if recipe_id == "stone_axe" else "Crafted Stone Pickaxe"\n\tequipped_tool_changed.emit(equipped_tool)\n\tcraft_completed.emit(recipe_id, tool_id)\n',
          )

          # Burrower: value-only observations at committed attack/damage boundaries.
          patch(
              'gameplay/creatures/underworld/burrower/burrower.gd',
              'signal died(enemy_id: String)\n',
              'signal died(enemy_id: String)\nsignal attack_started(enemy_id: String, world_position: Vector3)\nsignal damage_committed(enemy_id: String, amount: int, remaining_health: int, world_position: Vector3)\n',
          )
          patch(
              'gameplay/creatures/underworld/burrower/burrower.gd',
              '\thealth = maxi(health - amount, 0)\n\tstagger_timer = HIT_STAGGER_TIME\n',
              '\tvar previous_health: int = health\n\thealth = maxi(health - amount, 0)\n\tvar committed_damage: int = previous_health - health\n\tstagger_timer = HIT_STAGGER_TIME\n',
          )
          patch(
              'gameplay/creatures/underworld/burrower/burrower.gd',
              '\t_cancel_pending_attack()\n\n\tvar away: Vector3 = global_position - source_position\n',
              '\t_cancel_pending_attack()\n\tif committed_damage > 0:\n\t\tdamage_committed.emit(enemy_id, committed_damage, health, global_position)\n\n\tvar away: Vector3 = global_position - source_position\n',
          )
          patch(
              'gameplay/creatures/underworld/burrower/burrower.gd',
              '\tattack_timer = attack_cooldown\n\t_face_target(1.0)\n',
              '\tattack_timer = attack_cooldown\n\t_face_target(1.0)\n\tattack_started.emit(enemy_id, global_position)\n',
          )

          # Encounter: relay Burrower observations as value-only encounter outcomes; death before loot issuance.
          patch(
              'gameplay/creatures/spawning/prototype_burrower_encounter_controller.gd',
              'signal loot_pending(occurrence_id: String, profile_id: String, world_position: Vector3)\n',
              'signal loot_pending(occurrence_id: String, profile_id: String, world_position: Vector3)\nsignal enemy_attack_started(enemy_id: String, world_position: Vector3)\nsignal enemy_damage_committed(enemy_id: String, amount: int, remaining_health: int, world_position: Vector3)\nsignal enemy_died(enemy_id: String, world_position: Vector3)\n',
          )
          patch(
              'gameplay/creatures/spawning/prototype_burrower_encounter_controller.gd',
              '\t\tenemy.died.connect(_on_enemy_died)\n\t\tadd_child(enemy)\n',
              '\t\tenemy.attack_started.connect(_on_enemy_attack_started)\n\t\tenemy.damage_committed.connect(_on_enemy_damage_committed)\n\t\tenemy.died.connect(_on_enemy_died)\n\t\tadd_child(enemy)\n',
          )
          patch(
              'gameplay/creatures/spawning/prototype_burrower_encounter_controller.gd',
              '\n\nfunc _on_enemy_died(enemy_id: String) -> void:\n',
              '''\n\nfunc _on_enemy_attack_started(enemy_id: String, world_position: Vector3) -> void:\n\tif _is_finite_vector3(world_position):\n\t\tenemy_attack_started.emit(enemy_id, world_position)\n\n\nfunc _on_enemy_damage_committed(\n\tenemy_id: String,\n\tamount: int,\n\tremaining_health: int,\n\tworld_position: Vector3\n) -> void:\n\tif amount > 0 and remaining_health >= 0 and _is_finite_vector3(world_position):\n\t\tenemy_damage_committed.emit(enemy_id, amount, remaining_health, world_position)\n\n\nfunc _on_enemy_died(enemy_id: String) -> void:\n''',
          )
          patch(
              'gameplay/creatures/spawning/prototype_burrower_encounter_controller.gd',
              '\tif enemy_node != null and is_instance_valid(enemy_node):\n\t\tdeath_position = enemy_node.global_position\n\n\tif loot_ready:\n',
              '\tif enemy_node != null and is_instance_valid(enemy_node):\n\t\tdeath_position = enemy_node.global_position\n\tif _is_finite_vector3(death_position):\n\t\tenemy_died.emit(enemy_id, death_position)\n\n\tif loot_ready:\n',
          )

          # Cave runtime owns realized-cell presence semantics; audio only consumes transitions.
          patch(
              'worldgen/runtime/underworld_cave_runtime_controller.gd',
              'signal traversal_gate_changed(entrance_id: String, open: bool)\nsignal cell_attached(address, tier: String)\n',
              'signal traversal_gate_changed(entrance_id: String, open: bool)\nsignal cell_attached(address, tier: String)\nsignal cave_presence_changed(in_cave: bool)\n',
          )
          patch(
              'worldgen/runtime/underworld_cave_runtime_controller.gd',
              'var last_bootstrap_surface_position: Vector3 = Vector3.ZERO\n',
              'var last_bootstrap_surface_position: Vector3 = Vector3.ZERO\nvar _player_in_realized_cave: bool = false\n',
          )
          patch(
              'worldgen/runtime/underworld_cave_runtime_controller.gd',
              '\tplayer = player_value\n\tstreamer = Streamer.new(world_id, generator_manifest_id, executor)\n',
              '\tplayer = player_value\n\t_player_in_realized_cave = false\n\tstreamer = Streamer.new(world_id, generator_manifest_id, executor)\n',
          )
          patch(
              'worldgen/runtime/underworld_cave_runtime_controller.gd',
              '\tstreamer.update_observer(position, "player")\n\tfor entrance_id in gates.keys():\n',
              '\tstreamer.update_observer(position, "player")\n\t_update_cave_presence(position)\n\tfor entrance_id in gates.keys():\n',
          )
          patch(
              'worldgen/runtime/underworld_cave_runtime_controller.gd',
              '\n## Builds the compact renderer-facing semantic snapshot consumed by replaceable\n',
              '''\nfunc _update_cave_presence(position: Vector3) -> void:\n\tif not _is_finite_vector3(position):\n\t\treturn\n\tvar in_cave := false\n\tfor candidate in render_nodes.values():\n\t\tif candidate == null or not candidate is Node or not is_instance_valid(candidate):\n\t\t\tcontinue\n\t\tif not candidate.has_meta("cell_semantic_snapshot"):\n\t\t\tcontinue\n\t\tvar snapshot_variant = candidate.get_meta("cell_semantic_snapshot")\n\t\tif not snapshot_variant is Dictionary:\n\t\t\tcontinue\n\t\tvar bounds_variant = snapshot_variant.get("world_bounds", null)\n\t\tif bounds_variant is AABB:\n\t\t\tvar bounds: AABB = bounds_variant\n\t\t\tif bounds.size.x > 0.0 and bounds.size.y > 0.0 and bounds.size.z > 0.0 and bounds.has_point(position):\n\t\t\t\tin_cave = true\n\t\t\t\tbreak\n\tif in_cave == _player_in_realized_cave:\n\t\treturn\n\t_player_in_realized_cave = in_cave\n\tcave_presence_changed.emit(in_cave)\n\n\nfunc player_is_in_realized_cave() -> bool:\n\treturn _player_in_realized_cave\n\n\nstatic func _is_finite_vector3(value: Vector3) -> bool:\n\treturn (\n\t\tnot is_nan(value.x) and not is_inf(value.x)\n\t\tand not is_nan(value.y) and not is_inf(value.y)\n\t\tand not is_nan(value.z) and not is_inf(value.z)\n\t)\n\n\n## Builds the compact renderer-facing semantic snapshot consumed by replaceable\n''',
          )

          # Game forwards the existing authoritative loot collection result instead of discarding it.
          patch(
              'app/game/game.gd',
              '\tencounter_controller.collect_nearby_pending_loot(inventory_state)\n',
              '''\tvar collection_result: Dictionary = encounter_controller.collect_nearby_pending_loot(inventory_state)\n\tvar audio_binding := get_node_or_null("GameplayAudioBinding")\n\tif audio_binding != null and audio_binding.has_method("consume_loot_collection_result"):\n\t\taudio_binding.call("consume_loot_collection_result", collection_result)\n''',
          )

          # Replace presentation binder with signal/result-only routing. No gameplay polling.
          Path('presentation/audio/gameplay_audio_binding.gd').write_text(r'''extends Node
class_name UnderworldGameplayAudioBinding

const AudioController := preload("res://presentation/audio/audio_presentation_controller.gd")
const CueCatalog := preload("res://presentation/audio/audio_cue_catalog.gd")
const PrototypeCatalog := preload("res://content/presentation/audio/prototype_audio_cue_catalog.tres")
const ProvisionalStreams := preload("res://presentation/audio/provisional_audio_stream_library.gd")

const MAX_RECENT_CUES := 64

var _audio = null
var _bound: bool = false
var _recent_cues: Array[String] = []


func _ready() -> void:
	process_mode = Node.PROCESS_MODE_ALWAYS
	call_deferred("_bind_parent_game")


func _bind_parent_game() -> void:
	if _bound:
		return
	var parent := get_parent()
	if parent == null:
		return
	var failures: Array[String] = bind_game(parent)
	if not failures.is_empty():
		push_error("Gameplay audio binding failed: %s" % [failures])


func bind_game(game_node: Node) -> Array[String]:
	if _bound:
		return []
	if game_node == null:
		return ["gameplay audio binding requires Game parent"]
	var player = game_node.get("player")
	var survival = game_node.get("survival")
	var death_recovery = game_node.get("death_recovery_controller")
	var encounter = game_node.get("encounter_controller")
	var underworld = game_node.get("underworld_runtime")
	var failures: Array[String] = []
	for pair in [
		["Player", player],
		["Survival", survival],
		["death recovery controller", death_recovery],
		["Burrower encounter controller", encounter],
		["underworld runtime", underworld],
	]:
		if pair[1] == null:
			failures.append("gameplay audio binding requires %s" % pair[0])
	if not failures.is_empty():
		failures.sort()
		return failures

	var catalog = ProvisionalStreams.clone_with_missing_streams(PrototypeCatalog)
	if catalog == null or not catalog is CueCatalog:
		return ["gameplay audio binding could not build provisional cue catalog"]
	_audio = AudioController.new()
	_audio.name = "AudioPresentation"
	_audio.process_mode = Node.PROCESS_MODE_ALWAYS
	add_child(_audio)
	failures.append_array(_audio.configure(catalog))
	if not failures.is_empty():
		failures.sort()
		return failures

	_connect_required(player, "attack_requested", Callable(self, "_on_player_attack_requested"), failures)
	_connect_required(player, "parry_succeeded", Callable(self, "_on_player_parry_succeeded"), failures)
	_connect_required(player, "damage_committed", Callable(self, "_on_player_damage_committed"), failures)
	_connect_required(player, "defeat_requested", Callable(self, "_on_player_defeat_requested"), failures)
	_connect_required(survival, "harvest_result", Callable(self, "_on_harvest_result"), failures)
	_connect_required(survival, "equipped_tool_changed", Callable(self, "_on_equipped_tool_changed"), failures)
	_connect_required(survival, "craft_completed", Callable(self, "_on_craft_completed"), failures)
	_connect_required(death_recovery, "recovery_committed", Callable(self, "_on_recovery_committed"), failures)
	_connect_required(encounter, "loot_pending", Callable(self, "_on_loot_pending"), failures)
	_connect_required(encounter, "enemy_attack_started", Callable(self, "_on_enemy_attack_started"), failures)
	_connect_required(encounter, "enemy_damage_committed", Callable(self, "_on_enemy_damage_committed"), failures)
	_connect_required(encounter, "enemy_died", Callable(self, "_on_enemy_died"), failures)
	_connect_required(underworld, "cave_presence_changed", Callable(self, "_on_cave_presence_changed"), failures)
	if not failures.is_empty():
		failures.sort()
		return failures

	_bound = true
	_audio.set_ambience_role(CueCatalog.AMBIENCE_SURFACE)
	return []


func audio_controller():
	return _audio


func recent_cue_ids() -> Array[String]:
	return _recent_cues.duplicate()


func clear_recent_cues() -> void:
	_recent_cues.clear()


func is_bound() -> bool:
	return _bound


func consume_loot_collection_result(result: Dictionary) -> void:
	if not bool(result.get("success", false)):
		return
	for event_variant in result.get("events", []):
		if event_variant is Dictionary and str(event_variant.get("event", "")) == "loot.collected":
			_dispatch("audio_cue.loot.collected")


func consume_resource_mining_result(result: Dictionary, world_position: Vector3) -> void:
	if not bool(result.get("success", false)) or bool(result.get("duplicate", false)):
		return
	var committed := false
	for event_variant in result.get("events", []):
		if event_variant is Dictionary and str(event_variant.get("type", "")) == "resource.mined":
			committed = true
			break
	if not committed or not _finite_vector3(world_position):
		return
	_dispatch("audio_cue.resource.mine.impact", _spatial_payload(world_position))
	if bool(result.get("depleted", false)):
		_dispatch("audio_cue.resource.depleted", _spatial_payload(world_position))


func _on_player_attack_requested(execution: Dictionary) -> void:
	var attack_kind: String = str(execution.get("attack_kind", "light"))
	_dispatch("audio_cue.player.attack.heavy" if attack_kind == "heavy" else "audio_cue.player.attack.light")


func _on_player_parry_succeeded(_source_position: Vector3) -> void:
	_dispatch("audio_cue.player.parry.success")


func _on_player_damage_committed(amount: int, _remaining_health: int, _source_position: Vector3) -> void:
	if amount > 0:
		_dispatch("audio_cue.player.damage")


func _on_player_defeat_requested(_reason: StringName) -> void:
	_dispatch("audio_cue.player.death")


func _on_recovery_committed(_reason: StringName, _target: Vector3) -> void:
	_dispatch("audio_cue.player.respawn")


func _on_harvest_result(event: Dictionary) -> void:
	match str(event.get("type", "")):
		"harvest.hit_registered":
			var position_variant = event.get("world_position", null)
			if position_variant is Vector3 and _finite_vector3(position_variant):
				_dispatch("audio_cue.harvest.impact", _spatial_payload(position_variant))
		"harvest.completed":
			_dispatch("audio_cue.harvest.complete")
		"harvest.pickup_collected":
			_dispatch("audio_cue.inventory.pickup")


func _on_equipped_tool_changed(_tool_id: String) -> void:
	# Binding occurs deferred after Game startup/Continue synchronization, so only
	# subsequent committed equipment changes reach this callback.
	_dispatch("audio_cue.equipment.changed")


func _on_craft_completed(_recipe_id: String, _item_id: String) -> void:
	_dispatch("audio_cue.craft.success")


func _on_loot_pending(_occurrence_id: String, _profile_id: String, world_position: Vector3) -> void:
	if _finite_vector3(world_position):
		_dispatch("audio_cue.loot.available", _spatial_payload(world_position))


func _on_enemy_attack_started(_enemy_id: String, world_position: Vector3) -> void:
	if _finite_vector3(world_position):
		_dispatch("audio_cue.enemy.burrower.attack", _spatial_payload(world_position))


func _on_enemy_damage_committed(_enemy_id: String, amount: int, _remaining_health: int, world_position: Vector3) -> void:
	if amount > 0 and _finite_vector3(world_position):
		_dispatch("audio_cue.enemy.burrower.hit", _spatial_payload(world_position))


func _on_enemy_died(_enemy_id: String, world_position: Vector3) -> void:
	if _finite_vector3(world_position):
		_dispatch("audio_cue.enemy.burrower.death", _spatial_payload(world_position))


func _on_cave_presence_changed(in_cave: bool) -> void:
	if _audio != null:
		_audio.set_ambience_role(CueCatalog.AMBIENCE_CAVE if in_cave else CueCatalog.AMBIENCE_SURFACE)


func _dispatch(cue_id: String, payload: Dictionary = {}) -> Dictionary:
	if _audio == null:
		return {"success": false, "diagnostics": ["audio presentation is not bound"]}
	var result: Dictionary = _audio.dispatch(cue_id, payload)
	if bool(result.get("success", false)):
		_recent_cues.append(cue_id)
		if _recent_cues.size() > MAX_RECENT_CUES:
			_recent_cues.pop_front()
	return result


static func _spatial_payload(position: Vector3) -> Dictionary:
	return {"position": position, "intensity": 1.0}


static func _finite_vector3(value: Vector3) -> bool:
	return (
		not is_nan(value.x) and not is_inf(value.x)
		and not is_nan(value.y) and not is_inf(value.y)
		and not is_nan(value.z) and not is_inf(value.z)
	)


static func _connect_required(source, signal_name: String, callback: Callable, failures: Array[String]) -> void:
	if source == null or not source.has_signal(signal_name):
		failures.append("gameplay audio producer is missing required signal: %s" % signal_name)
		return
	if not source.is_connected(signal_name, callback):
		source.connect(signal_name, callback)
''')

          # Rewrite focused binding test around explicit semantic signals/results, not polling.
          Path('tests/presentation/test_gameplay_audio_binding.gd').write_text(r'''extends RefCounted

const Binding := preload("res://presentation/audio/gameplay_audio_binding.gd")
const CueCatalog := preload("res://presentation/audio/audio_cue_catalog.gd")

class FakePlayer:
	extends Node3D
	signal attack_requested(execution: Dictionary)
	signal parry_succeeded(source_position: Vector3)
	signal damage_committed(amount: int, remaining_health: int, source_position: Vector3)
	signal defeat_requested(reason: StringName)

class FakeSurvival:
	extends Node
	signal harvest_result(event: Dictionary)
	signal equipped_tool_changed(tool_id: String)
	signal craft_completed(recipe_id: String, item_id: String)

class FakeRecovery:
	extends Node
	signal recovery_committed(reason: StringName, target: Vector3)

class FakeEncounter:
	extends Node3D
	signal loot_pending(occurrence_id: String, profile_id: String, world_position: Vector3)
	signal enemy_attack_started(enemy_id: String, world_position: Vector3)
	signal enemy_damage_committed(enemy_id: String, amount: int, remaining_health: int, world_position: Vector3)
	signal enemy_died(enemy_id: String, world_position: Vector3)

class FakeUnderworld:
	extends Node3D
	signal cave_presence_changed(in_cave: bool)

class FakeGame:
	extends Node3D
	var player
	var survival
	var death_recovery_controller
	var encounter_controller
	var underworld_runtime


static func run() -> Array[String]:
	var failures: Array[String] = []
	var game := FakeGame.new()
	game.player = FakePlayer.new()
	game.survival = FakeSurvival.new()
	game.death_recovery_controller = FakeRecovery.new()
	game.encounter_controller = FakeEncounter.new()
	game.underworld_runtime = FakeUnderworld.new()
	for child in [game.player, game.survival, game.death_recovery_controller, game.encounter_controller, game.underworld_runtime]:
		game.add_child(child)
	var binding := Binding.new()
	game.add_child(binding)
	var bind_failures: Array[String] = binding.bind_game(game)
	if not bind_failures.is_empty():
		failures.append("semantic audio binding rejected complete producer set: %s" % [bind_failures])
		game.free()
		return failures

	_test_existing_semantic_routes(game, binding, failures)
	_test_committed_observation_routes(game, binding, failures)
	_test_typed_result_routes(binding, failures)
	_test_ambience_transition(game, binding, failures)
	_test_muting_never_changes_semantic_routing(game, binding, failures)
	_test_provisional_streams_are_audible(binding, failures)
	_test_scope_has_no_polling_or_gameplay_authority(failures)
	game.free()
	return failures


static func _test_existing_semantic_routes(game, binding, failures: Array[String]) -> void:
	binding.clear_recent_cues()
	game.player.attack_requested.emit({"attack_kind": &"light"})
	game.player.attack_requested.emit({"attack_kind": &"heavy"})
	game.player.parry_succeeded.emit(Vector3.ZERO)
	game.player.defeat_requested.emit(&"damage")
	game.death_recovery_controller.recovery_committed.emit(&"damage", Vector3(2, 3, 4))
	game.survival.harvest_result.emit({"type": "harvest.hit_registered", "world_position": Vector3(1, 2, 3)})
	game.survival.harvest_result.emit({"type": "harvest.completed"})
	game.survival.harvest_result.emit({"type": "harvest.pickup_collected"})
	game.encounter_controller.loot_pending.emit("burrower_1", "loot.profile", Vector3(4, 5, 6))
	_expect_sequence(binding.recent_cue_ids(), [
		"audio_cue.player.attack.light",
		"audio_cue.player.attack.heavy",
		"audio_cue.player.parry.success",
		"audio_cue.player.death",
		"audio_cue.player.respawn",
		"audio_cue.harvest.impact",
		"audio_cue.harvest.complete",
		"audio_cue.inventory.pickup",
		"audio_cue.loot.available",
	], "existing semantic producer routes", failures)


static func _test_committed_observation_routes(game, binding, failures: Array[String]) -> void:
	binding.clear_recent_cues()
	game.player.damage_committed.emit(12, 88, Vector3.ZERO)
	game.survival.equipped_tool_changed.emit("stone_axe")
	game.survival.craft_completed.emit("stone_axe", "item.tool.stone_axe")
	game.encounter_controller.enemy_attack_started.emit("burrower_1", Vector3(3, 0, 2))
	game.encounter_controller.enemy_damage_committed.emit("burrower_1", 5, 31, Vector3(3, 0, 2))
	game.encounter_controller.enemy_died.emit("burrower_1", Vector3(3, 0, 2))
	_expect_sequence(binding.recent_cue_ids(), [
		"audio_cue.player.damage",
		"audio_cue.equipment.changed",
		"audio_cue.craft.success",
		"audio_cue.enemy.burrower.attack",
		"audio_cue.enemy.burrower.hit",
		"audio_cue.enemy.burrower.death",
	], "committed observation routes", failures)


static func _test_typed_result_routes(binding, failures: Array[String]) -> void:
	binding.clear_recent_cues()
	binding.consume_loot_collection_result({"success": false, "events": []})
	binding.consume_loot_collection_result({"success": true, "events": [{"event": "loot.collected"}]})
	binding.consume_resource_mining_result({"success": true, "duplicate": true, "events": []}, Vector3.ONE)
	binding.consume_resource_mining_result({
		"success": true,
		"duplicate": false,
		"depleted": true,
		"events": [{"type": "resource.mined"}],
	}, Vector3(7, -3, 2))
	_expect_sequence(binding.recent_cue_ids(), [
		"audio_cue.loot.collected",
		"audio_cue.resource.mine.impact",
		"audio_cue.resource.depleted",
	], "typed loot/resource results", failures)


static func _test_ambience_transition(game, binding, failures: Array[String]) -> void:
	var audio = binding.audio_controller()
	if audio == null or audio.ambience_role() != CueCatalog.AMBIENCE_SURFACE:
		failures.append("binding did not seed surface ambience without a fake gameplay cue")
		return
	game.underworld_runtime.cave_presence_changed.emit(true)
	if audio.ambience_role() != CueCatalog.AMBIENCE_CAVE:
		failures.append("cave presence transition did not select cave ambience")
	game.underworld_runtime.cave_presence_changed.emit(false)
	if audio.ambience_role() != CueCatalog.AMBIENCE_SURFACE:
		failures.append("surface return did not restore surface ambience")
	if audio.ambience_player_count() != 1:
		failures.append("semantic ambience transitions did not reuse one ambience player")


static func _test_muting_never_changes_semantic_routing(game, binding, failures: Array[String]) -> void:
	var audio = binding.audio_controller()
	binding.clear_recent_cues()
	audio.set_muted(true)
	game.player.damage_committed.emit(1, 99, Vector3.ZERO)
	if binding.recent_cue_ids() != ["audio_cue.player.damage"]:
		failures.append("muting changed semantic audio routing")
	if audio.active_one_shot_count() != 0:
		failures.append("muted committed outcome created physical one-shot playback")
	audio.set_muted(false)


static func _test_provisional_streams_are_audible(binding, failures: Array[String]) -> void:
	var audio = binding.audio_controller()
	if audio == null:
		failures.append("provisional playback proof has no audio controller")
		return
	if not audio.is_inside_tree():
		failures.append("provisional playback proof requires mounted controller")
		return
	var result: Dictionary = audio.dispatch("audio_cue.player.respawn")
	if not bool(result.get("success", false)) or not bool(result.get("played", false)):
		failures.append("unmuted production binding did not start provisional respawn stream")


static func _test_scope_has_no_polling_or_gameplay_authority(failures: Array[String]) -> void:
	var source: String = FileAccess.get_file_as_string("res://presentation/audio/gameplay_audio_binding.gd")
	for forbidden in ["func _process(", "poll_now(", "last_action_message", "object_hit_progress", "active_enemies", "render_nodes", "world_delta_store"]:
		if source.contains(forbidden):
			failures.append("gameplay audio binding contains forbidden polling/authority fragment: %s" % forbidden)


static func _expect_sequence(actual: Array[String], expected: Array[String], label: String, failures: Array[String]) -> void:
	if actual != expected:
		failures.append("%s cue sequence mismatch: %s != %s" % [label, actual, expected])
