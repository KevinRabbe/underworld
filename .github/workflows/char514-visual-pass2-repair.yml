name: CHAR514 Visual Pass 2 Repair

on:
  push:
    branches:
      - worker/char-reconcile-001

permissions:
  contents: write

jobs:
  repair-pass-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout governed worker branch
        uses: actions/checkout@v6
        with:
          ref: worker/char-reconcile-001
          fetch-depth: 0

      - name: Assert exact repair base and unchanged source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD^)" = "8dd73f6d38750348c61376eed6c15afe2dbc7fc2"
          git merge-base --is-ancestor 2948912830c21a0f3e1578bc2dbd48da032368b3 HEAD
          git diff --exit-code b85f9dcbf3e2f13e327ddba9cae9db679deb5866 -- \
            presentation/characters/faceted/faceted_humanoid_body_profile.gd \
            presentation/characters/faceted/faceted_body_compiler.gd \
            presentation/characters/voxel/baseline_survivor_factory.gd

      - name: Reapply exact pass-2 source script with station-specific sole edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/char514-visual-pass2-once.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          code = textwrap.dedent(workflow[start:end])

          old_lines = [
              "    ('profile.foot_width * 0.52, 0.018, foot_skin', 'profile.foot_width * 0.58, 0.019, foot_skin'),",
              "    ('profile.foot_width * 0.58, 0.018, foot_skin', 'profile.foot_width * 0.64, 0.019, foot_skin'),",
              "    ('profile.foot_width * 0.64, 0.018, foot_skin', 'profile.foot_width * 0.71, 0.019, foot_skin'),",
              "    ('profile.foot_width * 0.60, 0.018, foot_skin', 'profile.foot_width * 0.68, 0.019, foot_skin'),",
              "    ('profile.foot_width * 0.52, 0.018, foot_skin', 'profile.foot_width * 0.60, 0.019, foot_skin'),",
          ]
          new_lines = [
              "    ('_ring_z(Vector3(x, sole_y + 0.018, heel_z + 0.005), profile.foot_width * 0.52, 0.018, foot_skin),', '_ring_z(Vector3(x, sole_y + 0.018, heel_z + 0.005), profile.foot_width * 0.58, 0.019, foot_skin),'),",
              "    ('_ring_z(Vector3(x, sole_y + 0.018, instep_z), profile.foot_width * 0.58, 0.018, foot_skin),', '_ring_z(Vector3(x, sole_y + 0.018, instep_z), profile.foot_width * 0.64, 0.019, foot_skin),'),",
              "    ('_ring_z(Vector3(x, sole_y + 0.018, ball_z - 0.003), profile.foot_width * 0.64, 0.018, foot_skin),', '_ring_z(Vector3(x, sole_y + 0.018, ball_z - 0.003), profile.foot_width * 0.71, 0.019, foot_skin),'),",
              "    ('_ring_z(Vector3(x, sole_y + 0.018, toe_base_z - 0.004), profile.foot_width * 0.60, 0.018, foot_skin),', '_ring_z(Vector3(x, sole_y + 0.018, toe_base_z - 0.004), profile.foot_width * 0.68, 0.019, foot_skin),'),",
              "    ('_ring_z(Vector3(x, sole_y + 0.018, toe_z - 0.005), profile.foot_width * 0.52, 0.018, foot_skin),', '_ring_z(Vector3(x, sole_y + 0.018, toe_z - 0.005), profile.foot_width * 0.60, 0.019, foot_skin),'),",
          ]
          old = "\n".join(old_lines)
          new = "\n".join(new_lines)
          if code.count(old) != 1:
              raise SystemExit(f'expected one ambiguous sole replacement block, got {code.count(old)}')
          code = code.replace(old, new, 1)
          exec(compile(code, '<char514-pass2>', 'exec'), {'__name__': '__main__'})
          PY

          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -Fxq 'presentation/characters/faceted/faceted_body_compiler.gd'
          printf '%s\n' "$changed" | grep -Fxq 'presentation/characters/voxel/baseline_survivor_factory.gd'
          git diff --exit-code -- presentation/characters/faceted/faceted_humanoid_body_profile.gd

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import changed presentation resources
        run: godot --headless --editor --path . --quit

      - name: Character contracts
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          godot --headless --path . --quit-after 1 --script res://tests/run_character.gd 2>&1 | tee "$log"
          ! grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$log"
          grep -Fq '[CHARACTER VALIDATION] PASS' "$log"

      - name: Repository layout
        run: python3 tools/ci/validate_repository_layout.py

      - name: Commit validated source and remove disposable workflows
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/char514-visual-pass2-once.yml \
                 .github/workflows/char514-visual-pass2-repair.yml
          git add presentation/characters/faceted/faceted_body_compiler.gd \
                  presentation/characters/voxel/baseline_survivor_factory.gd
          git diff --check --cached
          test ! -e .github/workflows/char514-visual-pass2-once.yml
          test ! -e .github/workflows/char514-visual-pass2-repair.yml
          git diff --exit-code --cached -- presentation/characters/faceted/faceted_humanoid_body_profile.gd
          git commit -m 'character: converge survivor visual mass and readability'
          git push origin HEAD:worker/char-reconcile-001
