name: Character Geometry Push

on:
  push:
    branches:
      - codex/char-present-001
    paths:
      - ".github/workflows/character-geometry-push.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/char-present-001
          fetch-depth: 0

      - name: Apply staged topology payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/character-geometry-patch.yml").read_text()
          marker = "python3 - <<'PY'\n"
          payload = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(payload), "character-geometry-payload", "exec"))
          PY
          git diff --check

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Validate character contracts
        shell: bash
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          godot --headless --path . --quit-after 1 --script res://tests/run_character.gd 2>&1 | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[CHARACTER VALIDATION] PASS' "$validation_log"

      - name: Commit geometry pass
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "underworld-character-worker"
          git config user.email "underworld-character-worker@users.noreply.github.com"
          git add presentation/characters/faceted/faceted_body_compiler.gd
          git commit -m "CHAR-PRESENT-001: shape articulated body silhouette"
          git push origin HEAD:codex/char-present-001
