name: Cross Region Validation

on:
  pull_request:
    paths:
      - 'worldgen/validation/graph_validator.gd'
      - 'tests/cross_region_validation/**'
      - 'tests/run_cross_region_validation.gd'
      - '.github/workflows/cross-region-validation.yml'
  push:
    branches:
      - 'validation/cross-region-edge-contract-v0.01'

permissions:
  contents: read

jobs:
  cross-region-validation:
    name: Godot cross-region validation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Run focused cross-region contracts
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          godot --headless --path . --quit-after 1 \
            --script res://tests/run_cross_region_validation.gd 2>&1 \
            | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[CROSS REGION VALIDATION] PASS' "$validation_log"

      - name: Run existing fast deterministic contracts
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          godot --headless --path . --quit-after 1 \
            --script res://tests/run_validation.gd -- --mode=fast 2>&1 \
            | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[VALIDATION] PASS fast' "$validation_log"
