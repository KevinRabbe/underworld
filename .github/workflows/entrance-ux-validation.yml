name: Entrance UX Validation

on:
  pull_request:
  push:
    branches:
      - 'm3/*'

permissions:
  contents: read

jobs:
  entrance-ux-contracts:
    name: Godot natural entrance contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Show Godot version
        run: godot --version

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Run natural entrance contracts
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          godot --headless --path . \
            --script res://tests/run_entrance_ux.gd 2>&1 \
            | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[ENTRANCE UX VALIDATION] PASS' "$validation_log"
