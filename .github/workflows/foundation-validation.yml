name: Deterministic Worldgen Validation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'foundation/**'
      - 'codex/**'
      - 'worldgen/**'

permissions:
  contents: read

jobs:
  deterministic-foundation:
    name: Godot headless contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        start-seed: [1, 26, 51, 76, 101, 126, 151, 176, 201, 226]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Show Godot version
        run: godot --version

      - name: Run foundation contracts
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          godot --headless --path . --quit-after 1 \
            --script res://tests/run_validation.gd -- --mode=fast 2>&1 \
            | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[VALIDATION] PASS fast' "$validation_log"

      - name: Run deterministic cave geometry batch probes
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          godot --headless --path . --quit-after 1 \
            --script res://tests/run_validation.gd -- \
            --mode=batch --start-seed=${{ matrix.start-seed }} --count=25 --region-radius=1 2>&1 \
            | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then
            exit 1
          fi
          grep -Fq '[VALIDATION] PASS batch' "$validation_log"
