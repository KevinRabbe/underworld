name: CHAR514 Sync Accepted Main Once

on:
  push:
    branches:
      - worker/char-reconcile-001

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout governed worker branch
        uses: actions/checkout@v6
        with:
          ref: worker/char-reconcile-001
          fetch-depth: 0

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Merge exact accepted main without committing runner
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "aa094a5a9737c4275067a41728ac1282b3a9a2c5"
          git merge --no-ff --no-commit aa094a5a9737c4275067a41728ac1282b3a9a2c5
          git rm .github/workflows/char514-sync-main-once.yml
          git diff --check --cached

      - name: Import merged resources
        run: godot --headless --editor --path . --quit

      - name: Repository layout
        run: python3 tools/ci/validate_repository_layout.py

      - name: World session contracts
        run: |
          set -o pipefail
          log="$(mktemp)"
          godot --headless --path . --script res://tests/run_world_session.gd 2>&1 | tee "$log"
          ! grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$log"
          grep -Fq '[WORLD SESSION VALIDATION] PASS' "$log"

      - name: Persistence contracts
        run: |
          set -o pipefail
          log="$(mktemp)"
          godot --headless --path . --script res://tests/run_persistence_state.gd 2>&1 | tee "$log"
          ! grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$log"
          grep -Fq '[PERSISTENCE STATE VALIDATION] PASS' "$log"

      - name: Character contracts
        run: |
          set -o pipefail
          log="$(mktemp)"
          godot --headless --path . --quit-after 1 --script res://tests/run_character.gd 2>&1 | tee "$log"
          ! grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$log"
          grep -Fq '[CHARACTER VALIDATION] PASS' "$log"

      - name: Commit clean accepted-main reconciliation
        shell: bash
        run: |
          set -euxo pipefail
          test ! -e .github/workflows/char514-sync-main-once.yml
          git diff --check
          git diff --check --cached
          git commit -m 'merge: reconcile #514 onto accepted main aa094a5a'
          git push origin HEAD:worker/char-reconcile-001
