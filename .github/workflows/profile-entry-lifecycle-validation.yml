name: Profile Entry Lifecycle Validation

on:
  pull_request:
    paths:
      - 'app/app_root.gd'
      - 'gameplay/persistence/profile_catalog.gd'
      - 'presentation/ui/screens/profile_setup/**'
      - 'tests/fixtures/app_shell_game_fixture.gd'
      - 'tests/persistence/test_profile_catalog.gd'
      - 'tests/persistence/test_profile_entry_lifecycle.gd'
      - 'tests/run_profile_entry_lifecycle.gd'
      - '.github/workflows/profile-entry-lifecycle-validation.yml'

permissions:
  contents: read

jobs:
  profile-entry-lifecycle:
    name: Godot profile entry lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Import project resources
        run: godot --headless --editor --path . --quit
      - name: Run profile catalog and AppRoot lifecycle contracts
        run: |
          set -o pipefail
          validation_log="$(mktemp)"
          godot --headless --path . --script res://tests/run_profile_catalog.gd 2>&1 | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then exit 1; fi
          grep -Fq '[PROFILE CATALOG VALIDATION] PASS' "$validation_log"
          godot --headless --path . --script res://tests/run_profile_entry_lifecycle.gd 2>&1 | tee "$validation_log"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$validation_log"; then exit 1; fi
          grep -Fq '[PROFILE ENTRY LIFECYCLE VALIDATION] PASS' "$validation_log"
