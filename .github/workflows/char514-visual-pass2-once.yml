name: CHAR514 Visual Pass 2 Once

on:
  push:
    branches:
      - worker/char-reconcile-001

permissions:
  contents: write

jobs:
  visual-pass-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout governed worker branch
        uses: actions/checkout@v6
        with:
          ref: worker/char-reconcile-001
          fetch-depth: 0

      - name: Assert exact starting candidate and accepted-main ancestry
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD^)" = "b85f9dcbf3e2f13e327ddba9cae9db679deb5866"
          git merge-base --is-ancestor 2948912830c21a0f3e1578bc2dbd48da032368b3 HEAD

      - name: Apply bounded presentation-only convergence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          profile = "presentation/characters/faceted/faceted_humanoid_body_profile.gd"
          for old, new in [
              ("@export var thigh_diameter: float = 0.225", "@export var thigh_diameter: float = 0.245"),
              ("@export var calf_diameter: float = 0.18", "@export var calf_diameter: float = 0.195"),
              ("@export var ankle_width: float = 0.105", "@export var ankle_width: float = 0.112"),
              ("@export var foot_length: float = 0.285", "@export var foot_length: float = 0.295"),
              ("@export var foot_width: float = 0.125", "@export var foot_width: float = 0.138"),
              ("@export var head_width: float = 0.218", "@export var head_width: float = 0.225"),
              ("@export var head_depth: float = 0.232", "@export var head_depth: float = 0.240"),
          ]:
              replace_once(profile, old, new)

          factory = "presentation/characters/voxel/baseline_survivor_factory.gd"
          for old, new in [
              ('_entry("cloth", Color("887257"), 0.93, 0.0)', '_entry("cloth", Color("7f6b50"), 0.93, 0.0)'),
              ('_entry("metal", Color("777d7b"), 0.82, 0.18)', '_entry("metal", Color("666c6b"), 0.82, 0.18)'),
              ('_entry("accent", Color("2f5e66"), 0.84, 0.0)', '_entry("accent", Color("294f56"), 0.84, 0.0)'),
              ('_entry("canvas_light", Color("aa9879"), 0.95, 0.0)', '_entry("canvas_light", Color("9d8c70"), 0.95, 0.0)'),
              ('_entry("trouser", Color("323637"), 0.92, 0.0)', '_entry("trouser", Color("292d2f"), 0.92, 0.0)'),
              ('_entry("canvas_dark", Color("625a49"), 0.96, 0.0)', '_entry("canvas_dark", Color("585243"), 0.96, 0.0)'),
              ('_entry("leather_light", Color("765037"), 0.84, 0.0)', '_entry("leather_light", Color("6b4934"), 0.84, 0.0)'),
              ('_tool_part("axe_handle", "stone_axe", _box(Vector3i(0,-12,0), Vector3i(0,5,0), LEATHER), Vector3i.ZERO)', '_tool_part("axe_handle", "stone_axe", _box(Vector3i(0,-11,0), Vector3i(0,5,0), LEATHER), Vector3i.ZERO)'),
          ]:
              replace_once(factory, old, new)
          replace_once(factory,
              '''\tvar rows := {\n\t\t0: [-1, 1],\n\t\t1: [-2, 1],\n\t\t2: [-3, 1],\n\t\t3: [-4, 1],\n\t\t4: [-4, 0],\n\t\t5: [-3, -1],\n\t\t6: [-2, -1],\n\t}''',
              '''\tvar rows := {\n\t\t0: [-2, 0],\n\t\t1: [-4, 1],\n\t\t2: [-5, 1],\n\t\t3: [-5, 0],\n\t\t4: [-4, -1],\n\t\t5: [-2, -1],\n\t}''')
          replace_once(factory, 'var is_lash: bool = x == 0 and y in [2, 3]', 'var is_lash: bool = x == 0 and y in [1, 2, 3]')

          compiler = "presentation/characters/faceted/faceted_body_compiler.gd"
          replace_once(compiler, "const COMPILER_REVISION := 12", "const COMPILER_REVISION := 13")

          # Close the jacket below the scarf while preserving a compact upper V.
          anchor = '''\t_add_quad_prism_z(builders, CLOTH,\n\t\tVector2(0.220, shoulder_y - 0.082),\n\t\tVector2(0.050, chest_y - 0.070),\n\t\tVector2(0.030, pelvis_y + 0.035),\n\t\tVector2(0.220, pelvis_y + 0.015),\n\t\tvest_front_z, vest_back_z, _weights2(BONE.chest, BONE.spine_02, 0.25))'''
          replacement = anchor + '''\n\t# The target jacket reads as one rugged closed garment below the neck wrap.\n\t# A compact centre panel removes the bright full-height V without hiding the\n\t# authored scarf/lapel opening above it.\n\t_add_quad_prism_z(builders, CLOTH,\n\t\tVector2(-0.058, chest_y - 0.078),\n\t\tVector2(0.058, chest_y - 0.078),\n\t\tVector2(0.026, pelvis_y + 0.030),\n\t\tVector2(-0.026, pelvis_y + 0.030),\n\t\tvest_front_z - 0.004, vest_back_z, _weights2(BONE.chest, BONE.spine_02, 0.42))\n\t_add_ribbon_z(builders, CANVAS_DARK,\n\t\tVector2(0.0, chest_y - 0.082), Vector2(0.0, pelvis_y + 0.028),\n\t\tvest_front_z - 0.014, 0.008,\n\t\t_weights(BONE.chest), _weights2(BONE.spine_02, BONE.pelvis, 0.32), -1.0)'''
          replace_once(compiler, anchor, replacement)

          # Stronger facial read at gameplay distance: broader brows, projected nose and mouth/chin plane.
          replace_once(compiler, 'var brow_outer := Vector2(side * 0.068, eye_y + 0.018)', 'var brow_outer := Vector2(side * 0.074, eye_y + 0.018)')
          replace_once(compiler, 'face_front - 0.022, 0.008, skin, skin, -1.0)', 'face_front - 0.024, 0.010, skin, skin, -1.0)')
          replace_once(compiler, 'var nose_tip_l := Vector3(-0.021, nose_tip_y, face_front - 0.064)', 'var nose_tip_l := Vector3(-0.022, nose_tip_y, face_front - 0.072)')
          replace_once(compiler, 'var nose_tip_r := Vector3(0.021, nose_tip_y, face_front - 0.064)', 'var nose_tip_r := Vector3(0.022, nose_tip_y, face_front - 0.072)')
          replace_once(compiler, 'var nose_base_l := Vector3(-0.025, nose_base_y, face_front - 0.028)', 'var nose_base_l := Vector3(-0.027, nose_base_y, face_front - 0.034)')
          replace_once(compiler, 'var nose_base_r := Vector3(0.025, nose_base_y, face_front - 0.028)', 'var nose_base_r := Vector3(0.027, nose_base_y, face_front - 0.034)')
          replace_once(compiler, 'Vector2(-0.050, mouth_y - 0.007)', 'Vector2(-0.056, mouth_y - 0.007)')
          replace_once(compiler, 'Vector2(0.050, mouth_y - 0.007)', 'Vector2(0.056, mouth_y - 0.007)')
          replace_once(compiler, '_add_ribbon_z(builders, FACE, Vector2(-0.034, mouth_y), Vector2(0.034, mouth_y), face_front - 0.020, 0.0040, skin, skin, -1.0)', '_add_ribbon_z(builders, FACE, Vector2(-0.040, mouth_y), Vector2(0.040, mouth_y), face_front - 0.024, 0.0050, skin, skin, -1.0)')

          # Pull the pack and roll into one compact expedition silhouette.
          replace_once(compiler,
              '''\t_add_y_loft(builders, CANVAS_DARK, [\n\t\t_ring_y(Vector3(0, waist_y - 0.030, 0.228), 0.165, 0.080, _weights(BONE.chest)),\n\t\t_ring_y(Vector3(0, lerpf(waist_y, lower_chest_y, 0.48), 0.250), 0.215, 0.115, _weights(BONE.chest)),\n\t\t_ring_y(Vector3(0, chest_y - 0.045, 0.260), 0.235, 0.125, _weights(BONE.chest)),\n\t\t_ring_y(Vector3(0, shoulder_y - 0.155, 0.252), 0.225, 0.115, _weights(BONE.chest)),\n\t\t_ring_y(Vector3(0, shoulder_y - 0.070, 0.232), 0.185, 0.090, _weights(BONE.chest)),\n\t], 8, true, true)''',
              '''\t_add_y_loft(builders, CANVAS_DARK, [\n\t\t_ring_y(Vector3(0, waist_y - 0.030, 0.220), 0.160, 0.075, _weights(BONE.chest)),\n\t\t_ring_y(Vector3(0, lerpf(waist_y, lower_chest_y, 0.48), 0.240), 0.205, 0.105, _weights(BONE.chest)),\n\t\t_ring_y(Vector3(0, chest_y - 0.045, 0.248), 0.225, 0.115, _weights(BONE.chest)),\n\t\t_ring_y(Vector3(0, shoulder_y - 0.155, 0.242), 0.215, 0.108, _weights(BONE.chest)),\n\t\t_ring_y(Vector3(0, shoulder_y - 0.070, 0.225), 0.175, 0.085, _weights(BONE.chest)),\n\t], 8, true, true)''')
          for old, new in [
              ('\t\t0.386, 0.416, _weights(BONE.chest))', '\t\t0.364, 0.392, _weights(BONE.chest))'),
              ('\t\t0.392, 0.425, _weights(BONE.chest))', '\t\t0.370, 0.398, _weights(BONE.chest))'),
              ('\t\t\t0.430, 0.016, _weights(BONE.chest), _weights(BONE.chest), 1.0)', '\t\t\t0.402, 0.016, _weights(BONE.chest), _weights(BONE.chest), 1.0)'),
              ('Vector3(strap_x - 0.018, lower_chest_y - 0.010, 0.428)', 'Vector3(strap_x - 0.018, lower_chest_y - 0.010, 0.400)'),
              ('Vector3(strap_x + 0.018, lower_chest_y + 0.024, 0.442)', 'Vector3(strap_x + 0.018, lower_chest_y + 0.024, 0.414)'),
              ('_ring_x(Vector3(-0.235, shoulder_y - 0.010, 0.340), 0.073, 0.078, _weights(BONE.chest))', '_ring_x(Vector3(-0.220, shoulder_y - 0.025, 0.306), 0.066, 0.072, _weights(BONE.chest))'),
              ('_ring_x(Vector3(0.235, shoulder_y - 0.010, 0.340), 0.073, 0.078, _weights(BONE.chest))', '_ring_x(Vector3(0.220, shoulder_y - 0.025, 0.306), 0.066, 0.072, _weights(BONE.chest))'),
              ('\t\t\t0.432, 0.014, _weights(BONE.chest), _weights(BONE.chest), 1.0)', '\t\t\t0.394, 0.014, _weights(BONE.chest), _weights(BONE.chest), 1.0)'),
              ('Vector3(roll_strap_x - 0.014, shoulder_y - 0.016, 0.430)', 'Vector3(roll_strap_x - 0.014, shoulder_y - 0.030, 0.392)'),
              ('Vector3(roll_strap_x + 0.014, shoulder_y + 0.012, 0.444)', 'Vector3(roll_strap_x + 0.014, shoulder_y - 0.002, 0.406)'),
          ]:
              replace_once(compiler, old, new)

          # Broaden the boot shaft around the newly heavier lower leg.
          for old, new in [
              ('profile.calf_diameter * 0.70, profile.calf_diameter * 0.65, profile.calf_diameter * 0.73', 'profile.calf_diameter * 0.76, profile.calf_diameter * 0.70, profile.calf_diameter * 0.79'),
              ('profile.ankle_width * 0.62, profile.ankle_width * 0.62, profile.ankle_width * 0.68', 'profile.ankle_width * 0.68, profile.ankle_width * 0.67, profile.ankle_width * 0.73'),
              ('profile.ankle_width * 0.56, profile.ankle_width * 0.59, profile.ankle_width * 0.62', 'profile.ankle_width * 0.62, profile.ankle_width * 0.64, profile.ankle_width * 0.68'),
          ]:
              replace_once(compiler, old, new)
          PY
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -Fxq 'presentation/characters/faceted/faceted_humanoid_body_profile.gd'
          printf '%s\n' "$changed" | grep -Fxq 'presentation/characters/faceted/faceted_body_compiler.gd'
          printf '%s\n' "$changed" | grep -Fxq 'presentation/characters/voxel/baseline_survivor_factory.gd'

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import changed presentation resources
        run: godot --headless --editor --path . --quit

      - name: Character contracts
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          godot --headless --path . --quit-after 1 --script res://tests/run_character.gd 2>&1 | tee "$log"
          ! grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|handle_crash' "$log"
          grep -Fq '[CHARACTER VALIDATION] PASS' "$log"

      - name: Repository layout
        run: python3 tools/ci/validate_repository_layout.py

      - name: Commit validated presentation delta
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/char514-visual-pass2-once.yml
          git add presentation/characters/faceted/faceted_humanoid_body_profile.gd \
                  presentation/characters/faceted/faceted_body_compiler.gd \
                  presentation/characters/voxel/baseline_survivor_factory.gd
          git diff --check --cached
          test ! -e .github/workflows/char514-visual-pass2-once.yml
          git commit -m 'character: converge survivor visual mass and readability'
          git push origin HEAD:worker/char-reconcile-001
