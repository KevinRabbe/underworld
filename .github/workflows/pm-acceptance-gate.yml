name: PM Acceptance Gate

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft

permissions: {}

jobs:
  pm-acceptance:
    name: Publish trusted PM acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
      pull-requests: read
      statuses: write

    steps:
      - name: Evaluate and publish exact-head PM acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STATUS_CONTEXT: PM acceptance
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          publish_status() {
            local state="$1"
            local description="$2"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${EVENT_HEAD_SHA}" \
              -f state="$state" \
              -f context="$STATUS_CONTEXT" \
              -f description="$description" \
              -f target_url="$RUN_URL" \
              >/dev/null
          }

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          current_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"

          if [ "$EVENT_ACTION" = "synchronize" ]; then
            has_acceptance="$(
              jq -r '[.labels[].name] | index("pm-accepted") != null' <<<"$pr_json"
            )"

            if [ "$has_acceptance" = "true" ]; then
              if ! gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/pm-accepted" \
                >/dev/null; then
                publish_status failure "New commit invalidated PM acceptance; label cleanup failed"
                echo "Failed to remove stale pm-accepted label."
                exit 1
              fi
            fi

            current_labels="$(
              gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
                --jq '.[].name'
            )"
            publish_status failure "New commit requires PM re-acceptance"

            if printf '%s\n' "$current_labels" | grep -Fxq 'pm-accepted'; then
              echo "Stale pm-accepted label remains after synchronize."
              exit 1
            fi

            if [ "$current_head_sha" != "$EVENT_HEAD_SHA" ]; then
              echo "Event head ${EVENT_HEAD_SHA} was superseded by ${current_head_sha}; both require fresh acceptance."
            fi

            echo "Published failing PM acceptance status for synchronized head ${EVENT_HEAD_SHA}."
            exit 0
          fi

          if [ "$current_head_sha" != "$EVENT_HEAD_SHA" ]; then
            publish_status failure "Superseded head; PM acceptance invalid"
            echo "Event head ${EVENT_HEAD_SHA} is no longer current (${current_head_sha})."
            exit 0
          fi

          is_draft="$(jq -r '.draft' <<<"$pr_json")"
          has_acceptance="$(
            jq -r '[.labels[].name] | index("pm-accepted") != null' <<<"$pr_json"
          )"

          if [ "$is_draft" = "true" ]; then
            publish_status failure "Draft PR cannot be PM-accepted"
            echo "PR is draft; published failing PM acceptance status."
            exit 0
          fi

          if [ "$has_acceptance" != "true" ]; then
            publish_status failure "Missing pm-accepted for current head"
            echo "Current head lacks pm-accepted; published failing PM acceptance status."
            exit 0
          fi

          publish_status success "PM accepted exact current PR head"
          echo "Published successful PM acceptance status for ${EVENT_HEAD_SHA}."
