name: Operational PM Acceptance Gate

# SECURITY BOUNDARY:
# This workflow is trusted default-branch code and never executes PR-controlled
# content, but the `PM acceptance` commit-status context is NOT source-isolated
# from other same-repository GitHub Actions workflows. A PR-controlled workflow
# with statuses: write runs as the same GitHub Actions App and can mint the same
# context name. This is therefore an operational same-principal guard, not a
# cryptographic/actor-separated authorization boundary. See MAIN_MERGE_GATE.md.

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft

permissions: {}

concurrency:
  group: pm-acceptance-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  operational-pm-acceptance:
    name: Operational PM acceptance publisher
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
      issues: write
      statuses: write

    steps:
      - name: Coordinate exact-head PM acceptance state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          read_pr() {
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
          }

          publish_status() {
            local sha="$1"
            local state="$2"
            local description="$3"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
              -f state="$state" \
              -f context='PM acceptance' \
              -f description="$description" \
              -f target_url="$RUN_URL" \
              >/dev/null
            echo "Published PM acceptance=${state} for ${sha}: ${description}"
          }

          current_json="$(read_pr)"
          current_head_sha="$(jq -r '.head.sha' <<<"$current_json")"

          # A delayed event for an older head must not mutate labels or publish
          # acceptance state for the newer head.
          if [ "$current_head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "Ignoring superseded ${EVENT_ACTION} event for ${EVENT_HEAD_SHA}; live head is ${current_head_sha}."
            exit 0
          fi

          case "$EVENT_ACTION" in
            synchronize)
              # Fail the exact new head before metadata cleanup. If this run is
              # cancelled after publication, the head remains fail-closed.
              publish_status "$EVENT_HEAD_SHA" failure "New commit requires explicit PM re-acceptance"

              has_acceptance="$(jq -r '[.labels[].name] | index("pm-accepted") != null' <<<"$current_json")"
              if [ "$has_acceptance" = "true" ]; then
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/pm-accepted" \
                  >/dev/null
              fi

              decision_json="$(read_pr)"
              decision_head="$(jq -r '.head.sha' <<<"$decision_json")"
              if [ "$decision_head" != "$EVENT_HEAD_SHA" ]; then
                echo "Synchronize event was superseded during metadata cleanup; newer head owns acceptance state."
                exit 0
              fi

              remaining_acceptance="$(jq -r '[.labels[].name] | index("pm-accepted") != null' <<<"$decision_json")"
              if [ "$remaining_acceptance" = "true" ]; then
                publish_status "$EVENT_HEAD_SHA" failure "New commit requires PM re-acceptance; stale label remains"
                echo "Failed to invalidate stale pm-accepted label."
                exit 1
              fi

              echo "Synchronized head is fail-closed and stale PM metadata is clear."
              ;;

            converted_to_draft|opened|reopened|ready_for_review)
              # Lifecycle transitions never manufacture acceptance from a label
              # that happens to persist. A fresh explicit pm-accepted label event
              # is the only grant path.
              decision_json="$(read_pr)"
              decision_head="$(jq -r '.head.sha' <<<"$decision_json")"
              if [ "$decision_head" != "$EVENT_HEAD_SHA" ]; then
                echo "Lifecycle event was superseded before its decision point."
                exit 0
              fi
              publish_status "$EVENT_HEAD_SHA" failure "Explicit PM acceptance is required for this exact head"
              ;;

            unlabeled)
              decision_json="$(read_pr)"
              decision_head="$(jq -r '.head.sha' <<<"$decision_json")"
              if [ "$decision_head" != "$EVENT_HEAD_SHA" ]; then
                echo "Unlabeled event was superseded before its decision point."
                exit 0
              fi

              is_draft="$(jq -r '.draft' <<<"$decision_json")"
              has_acceptance="$(jq -r '[.labels[].name] | index("pm-accepted") != null' <<<"$decision_json")"
              if [ "$EVENT_LABEL" = "pm-accepted" ] || [ "$is_draft" = "true" ] || [ "$has_acceptance" != "true" ]; then
                publish_status "$EVENT_HEAD_SHA" failure "PM acceptance is absent or revoked for this exact head"
              else
                echo "Unrelated label removal cannot grant or revoke a still-valid PM acceptance state."
              fi
              ;;

            labeled)
              if [ "$EVENT_LABEL" != "pm-accepted" ]; then
                decision_json="$(read_pr)"
                decision_head="$(jq -r '.head.sha' <<<"$decision_json")"
                if [ "$decision_head" != "$EVENT_HEAD_SHA" ]; then
                  echo "Unrelated labeled event was superseded before its decision point."
                  exit 0
                fi

                is_draft="$(jq -r '.draft' <<<"$decision_json")"
                has_acceptance="$(jq -r '[.labels[].name] | index("pm-accepted") != null' <<<"$decision_json")"
                if [ "$is_draft" = "true" ] || [ "$has_acceptance" != "true" ]; then
                  publish_status "$EVENT_HEAD_SHA" failure "PM acceptance is not currently valid for this exact head"
                else
                  echo "Unrelated label event cannot grant PM acceptance; existing status is left unchanged."
                fi
                exit 0
              fi

              # Only an explicit pm-accepted label event can grant success.
              decision_json="$(read_pr)"
              decision_head="$(jq -r '.head.sha' <<<"$decision_json")"
              is_draft="$(jq -r '.draft' <<<"$decision_json")"
              has_acceptance="$(jq -r '[.labels[].name] | index("pm-accepted") != null' <<<"$decision_json")"

              if [ "$decision_head" != "$EVENT_HEAD_SHA" ]; then
                echo "Acceptance event was superseded before its decision point."
                exit 0
              fi
              if [ "$is_draft" = "true" ]; then
                publish_status "$EVENT_HEAD_SHA" failure "Draft PR cannot be PM-accepted"
                exit 0
              fi
              if [ "$has_acceptance" != "true" ]; then
                publish_status "$EVENT_HEAD_SHA" failure "pm-accepted was removed before the grant decision"
                exit 0
              fi

              publish_status "$EVENT_HEAD_SHA" success "PM explicitly accepted this exact PR head"

              # Re-read after success publication. If acceptance was removed or
              # the PR became draft while this run was deciding, immediately
              # overwrite success with failure. Any later state change also
              # emits its own coordinated event and supersedes this run.
              verify_json="$(read_pr)"
              verify_head="$(jq -r '.head.sha' <<<"$verify_json")"
              verify_draft="$(jq -r '.draft' <<<"$verify_json")"
              verify_acceptance="$(jq -r '[.labels[].name] | index("pm-accepted") != null' <<<"$verify_json")"

              if [ "$verify_head" != "$EVENT_HEAD_SHA" ] || [ "$verify_draft" = "true" ] || [ "$verify_acceptance" != "true" ]; then
                publish_status "$EVENT_HEAD_SHA" failure "PM acceptance changed during grant evaluation"
                exit 0
              fi
              ;;

            *)
              echo "Unsupported event action: ${EVENT_ACTION}"
              exit 1
              ;;
          esac
