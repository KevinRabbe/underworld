name: PM Acceptance Metadata Guard

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft

permissions: {}

# This workflow is deliberately NOT the authoritative PM acceptance publisher.
# Same-repository pull_request workflows run under the GitHub Actions App and
# can request statuses:write, so any status emitted by Actions is source-spoofable
# relative to another Actions workflow. The required `PM acceptance` context is
# reserved for a distinct external GitHub App and must be source-bound to that
# App in the main ruleset.
concurrency:
  group: pm-acceptance-metadata-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance-metadata-guard:
    name: PM acceptance metadata guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
      issues: write

    steps:
      - name: Keep pm-accepted metadata fail-closed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          read_pr() {
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
          }

          remove_acceptance_if_present() {
            local pr_json="$1"
            local has_acceptance
            has_acceptance="$(jq -r '[.labels[].name] | index("pm-accepted") != null' <<<"$pr_json")"
            if [ "$has_acceptance" = "true" ]; then
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/pm-accepted" \
                >/dev/null
            fi
          }

          current_json="$(read_pr)"
          current_head_sha="$(jq -r '.head.sha' <<<"$current_json")"

          # Never let an event for an older head mutate metadata on a newer head.
          if [ "$current_head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "Ignoring superseded ${EVENT_ACTION} event for ${EVENT_HEAD_SHA}; live head is ${current_head_sha}."
            exit 0
          fi

          case "$EVENT_ACTION" in
            synchronize|reopened|ready_for_review|converted_to_draft)
              # These transitions invalidate any earlier approval metadata. The
              # external PM App independently publishes authoritative failure on
              # the exact head and must not depend on this cleanup succeeding.
              remove_acceptance_if_present "$current_json"
              ;;

            labeled)
              if [ "$EVENT_LABEL" = "pm-accepted" ]; then
                decision_json="$(read_pr)"
                decision_head="$(jq -r '.head.sha' <<<"$decision_json")"
                is_draft="$(jq -r '.draft' <<<"$decision_json")"

                if [ "$decision_head" != "$EVENT_HEAD_SHA" ]; then
                  echo "Acceptance label event was superseded before validation."
                  exit 0
                fi

                # Approval metadata applied to a draft is never retained. A new
                # explicit acceptance action is required after the PR is ready.
                if [ "$is_draft" = "true" ]; then
                  remove_acceptance_if_present "$decision_json"
                fi
              fi
              ;;

            opened|unlabeled)
              # No mutation required. The external App evaluates exact-head
              # acceptance independently and is the only required-status source.
              ;;

            *)
              echo "Unsupported event action: ${EVENT_ACTION}"
              exit 1
              ;;
          esac

          verify_json="$(read_pr)"
          verify_head="$(jq -r '.head.sha' <<<"$verify_json")"
          if [ "$verify_head" != "$EVENT_HEAD_SHA" ]; then
            echo "PR advanced during metadata guard; newer event owns the new head."
            exit 0
          fi

          if [ "$EVENT_ACTION" = "synchronize" ] || \
             [ "$EVENT_ACTION" = "reopened" ] || \
             [ "$EVENT_ACTION" = "ready_for_review" ] || \
             [ "$EVENT_ACTION" = "converted_to_draft" ]; then
            remaining="$(jq -r '[.labels[].name] | index("pm-accepted") != null' <<<"$verify_json")"
            if [ "$remaining" = "true" ]; then
              echo "Stale pm-accepted metadata remains after ${EVENT_ACTION}."
              exit 1
            fi
          fi

          echo "PM metadata guard complete. Authoritative status must come from the external PM App."
