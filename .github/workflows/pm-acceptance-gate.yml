name: PM Acceptance Gate

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft

permissions: {}

jobs:
  trusted-pm-acceptance:
    name: Trusted PM acceptance publisher
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
      issues: write
      statuses: write

    steps:
      - name: Publish exact-head PM acceptance status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          live_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          is_draft="$(jq -r '.draft' <<<"$pr_json")"
          has_pm_acceptance="$(jq -r '[.labels[].name] | index("pm-accepted") != null' <<<"$pr_json")"

          if [ -z "$live_head_sha" ] || [ "$live_head_sha" = "null" ]; then
            echo "Unable to resolve the live PR head SHA."
            exit 1
          fi

          # Never let a delayed event for an older head mutate acceptance state or
          # publish a success status for a newer head. A newer event will evaluate
          # the current head independently.
          if [ "$live_head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "Ignoring superseded ${EVENT_ACTION} event for ${EVENT_HEAD_SHA}; live head is ${live_head_sha}."
            exit 0
          fi

          status_state="failure"
          status_description="PM acceptance is required for this exact PR head."

          if [ "$EVENT_ACTION" = "synchronize" ]; then
            if [ "$has_pm_acceptance" = "true" ]; then
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/pm-accepted" \
                >/dev/null
            fi

            remaining_acceptance="$(gh api \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '[.labels[].name] | index("pm-accepted") != null')"

            if [ "$remaining_acceptance" = "true" ]; then
              echo "Failed to invalidate stale pm-accepted after synchronize."
              exit 1
            fi

            status_description="New commit invalidated PM acceptance for this head."
          elif [ "$is_draft" = "true" ]; then
            status_description="Draft PRs cannot satisfy PM acceptance."
          elif [ "$has_pm_acceptance" != "true" ]; then
            status_description="Missing pm-accepted for this exact PR head."
          else
            status_state="success"
            status_description="PM accepted this exact non-draft PR head."
          fi

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${live_head_sha}" \
            -f state="$status_state" \
            -f context='PM acceptance' \
            -f description="$status_description" \
            -f target_url="$RUN_URL" \
            >/dev/null

          echo "Published PM acceptance=${status_state} for ${live_head_sha}: ${status_description}"
